apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-demo
  namespace: nginx-demo
  labels:
    application: nginx-demo
    owner: platform-team
    environment: dev

spec:
  replicas: 10

  selector:
    matchLabels:
      app: nginx-demo

  template:
    metadata:
      labels:
        app: nginx-demo

    spec:
      containers:
        - name: nginx
          image: nginx:1.30.0

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          ports:
            - containerPort: 80
