apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: network-governance
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/EXAMPLE-ORG/dev-ops-12-gitops-configuration-management-platform.git
    targetRevision: HEAD
    path: kubernetes/governance/network

  destination:
    server: https://kubernetes.default.svc
    namespace: netpol-test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
